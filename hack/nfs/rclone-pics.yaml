apiVersion: batch/v1
kind: Job
metadata:
  name: rclone-transfer-job-pictures 
  namespace: photoprism
spec:
  template:
    spec:
      hostNetwork: true
      restartPolicy: OnFailure  # Ensures the job retries if it fails
      containers:
      - name: rclone-container
        image: rclone/rclone:latest  # Rclone image to perform the file transfer
        command: ["/bin/sh", "-c"]
        args:
          - |
            rclone copy /mnt/cloud/Pictures/ /mnt/pv/ --ignore-existing --transfers=8 --checkers=16 --progress &&
            echo "File transfer completed."
        volumeMounts:
        - name: nfs-volume
          mountPath: /mnt/cloud  # NFS mount
        - name: pvc-volume
          mountPath: /mnt/pv  # PV mount
      volumes:
      - name: nfs-volume
        nfs:
          server: 192.168.2.205  # Replace with your NFS server IP
          path: /mnt/vault/cloud  # NFS export path
      - name: pvc-volume
        persistentVolumeClaim:
          claimName: photoprism-originals  # PVC reference for the PV
