apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dad-winners
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://gitlab.com/mershab-homelab/dad/winners.git'
    targetRevision: main
    path: 'charts/winners'
    helm:
      parameters: {}
#        - name: someParameter
#          value: someValue
      values: |
        service:
          type: ClusterIP
        ingress:
          enabled: true
          annotations:
            kubernetes.io/ingress.class: nginx
          hosts:
            - host: winners.mershab.com
              paths:
                - /
  destination:
    name: loft-homelab-vcluster-dad
    namespace: 
  syncPolicy:
    automated: 
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - priority=8
