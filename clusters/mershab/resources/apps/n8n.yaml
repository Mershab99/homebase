apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mershab-n8n
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/8gears/n8n-helm-chart.git'
    targetRevision: HEAD
    path: 'charts/n8n'
    helm:
      parameters:
        - name: someParameter
          value: someValue
      values: |
        config:
          host: n8n.mershab.com
          extraEnv:
          # Set this if running behind a reverse proxy and the external port is different from the port n8n runs on
            WEBHOOK_URL: "https://n8n.mershab.com/"
        service:
          type: ClusterIP
        ingress:
          enabled: true
          annotations:
            kubernetes.io/ingress.class: nginx
          hosts:
            - host: n8n.mershab.com
              paths:
                - /
          scaling:
            webhook:
              enabled: true
        persistence:
          enabled: true
  destination:
    name: loft-homelab-vcluster-mershab
    namespace: n8n
  syncPolicy:
    automated: 
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - priority=8
