apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mershab-website
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Mershab99/website.git'
    targetRevision: main
    path: 'charts/website'
    helm:
      parameters:
        - name: someParameter
          value: someValue
      values: |
        service:
          type: ClusterIP
        ingress:
          enabled: true
          annotations:
            kubernetes.io/ingress.class: nginx
          hosts:
            - host: mershab.com
              paths:
                - /
            - host: www.mershab.com
              paths:
                - /
  destination:
    name: loft-homelab-vcluster-vcluster-mershab
    namespace: website
  syncPolicy:
    automated: 
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - priority=8
