apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: langflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://langflow-ai.github.io/langflow-helm-charts
    targetRevision: 0.1.0
    chart: langflow-ide
    helm:
      valuesObject:
        postgresql:
          enabled: true
          fullnameOverride: "langflow-ide-postgresql-service"
          auth:
            username: "langflow"
            password: "langflow-postgres"
            database: "langflow-db"

        langflow:
          backend:
            externalDatabase:
              enabled: true
              driver:
                value: "postgresql"
              host:
                value: "langflow-ide-postgresql-service"
              port:
                value: "5432"
              database:
                value: "langflow-db"
              user:
                value: "langflow"
              password:
                valueFrom:
                  secretKeyRef:
                    key: "password"
                    name: "langflow-ide-postgresql-service"
            sqlite:
              enabled: false
        ingress:
          ingressClassName: "nginx" # "nginx"
          enabled: true
          annotations:
            kubernetes.io/ingress.class: "nginx"  # Specifies the ingress controller class
            nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
            nginx.ingress.kubernetes.io/backend-protocol: "HTTP"

          hosts:
          - host: langflow.mershab.com
            paths:
              - path: /
                pathType: ImplementationSpecific

  syncPolicy:
    automated: 
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - priority=8
  destination:
    name: loft-main-vcluster-home
    namespace: homebridge
