apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: langflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://langflow-ai.github.io/langflow-helm-charts
    targetRevision: 0.1.0
    chart: langflow-ide
    releaseName: lf-ide
    helm:
      valuesObject:
        ingress:
          ingressClassName: "nginx" # "nginx"
          enabled: true
          annotations:
            kubernetes.io/ingress.class: "nginx"  # Specifies the ingress controller class
              #nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
              #nginx.ingress.kubernetes.io/backend-protocol: "HTTP"

          hosts:
          - host: langflow.mershab.com
            paths:
              - path: /
                #pathType: ImplementationSpecific
        # Deploy postgresql. You can skip this section if you have an existing postgresql database.
        postgresql:
          enabled: true
          fullnameOverride: "lf-ide-postgresql-service"
          auth:
            username: "lf"
            password: "lf-postgres"
            database: "lf-db"

        langflow:
          backend:
            externalDatabase:
              enabled: true
              driver:
                value: "postgresql"
              host:
                value: "lf-ide-postgresql-service"
              port:
                value: "5432"
              database:
                value: "lf-db"
              user:
                value: "lf"
              password:
                valueFrom:
                  secretKeyRef:
                    key: "password"
                    name: "lf-ide-postgresql-service"
            sqlite:
              enabled: false

  syncPolicy:
    automated: 
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - priority=8
  destination:
    name: loft-main-vcluster-home
    namespace: lf
