
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pdf-editor-helm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://dipankardas011.github.io/PDF-Editor/
    targetRevision: 1.0.0
    chart: pdf-editor-helm
    helm:
      valuesObject:
        ingress:
          enabled: true
          className: "nginx" # "nginx"
          annotations:
            nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
            nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
          hosts:
          - host: pdf.mershab.com
            paths:
              - path: /
                pathType: ImplementationSpecific
  syncPolicy:
    automated: 
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - priority=8
  destination:
    name: loft-main-vcluster-home
    namespace: pdf-editor-helm
